          package com.smarthud.glasses;

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;

          /** Foreground service that keeps the app process (Bluetooth link, GPS, notifications) alive in the background. */
          public class KeepAliveService extends Service {

              private static final String CHANNEL = "smarthud_keep";
              private static final int ID = 1601;

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  try {
                      if (Build.VERSION.SDK_INT >= 26) {
                          NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                          if (nm != null) {
                              NotificationChannel ch = new NotificationChannel(CHANNEL, "Smart HUD", NotificationManager.IMPORTANCE_LOW);
                              ch.setShowBadge(false);
                              nm.createNotificationChannel(ch);
                          }
                      }
                      Intent open = new Intent(this, MainActivity.class);
                      open.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_NEW_TASK);
                      PendingIntent pi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                      Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, CHANNEL) : new Notification.Builder(this);
                      b.setContentTitle("Smart HUD");
                      b.setContentText("Bril verbonden / Glasses connected");
                      b.setSmallIcon(android.R.drawable.stat_sys_data_bluetooth);
                      b.setOngoing(true);
                      b.setContentIntent(pi);
                      Notification n = b.build();

                      if (Build.VERSION.SDK_INT >= 29) {
                          int type = 0;
                          boolean loc = checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                          boolean bt = Build.VERSION.SDK_INT < 31 || checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED;
                          if (bt) type |= ServiceInfo.FOREGROUND_SERVICE_TYPE_CONNECTED_DEVICE;
                          if (loc) type |= ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION;
                          if (type == 0) {
                              stopSelf();
                              return START_NOT_STICKY;
                          }
                          startForeground(ID, n, type);
                      } else {
                          startForeground(ID, n);
                      }
                  } catch (Throwable t) {
                      stopSelf();
                  }
                  return START_NOT_STICKY;
              }

              @Override
              public void onDestroy() {
                  try {
                      stopForeground(true);
                  } catch (Throwable t) {
                      // ignore
                  }
                  super.onDestroy();
              }
          }
          WF_EOF

