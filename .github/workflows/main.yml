          package com.smarthud.glasses;

          import android.app.Notification;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;

          import org.json.JSONObject;

          import java.util.ArrayDeque;

          /**
           * Reads every notification posted on the phone (needs the "Notification access" permission)
           * and hands it to the page, which forwards it to the glasses.
           */
          public class NotifService extends NotificationListenerService {

              public interface Sink {
                  void onNotif(String json);
              }

              public static volatile Sink sink;
              private static final ArrayDeque<String> BACKLOG = new ArrayDeque<>();
              private static final ArrayDeque<Long> BACKLOG_T = new ArrayDeque<>();

              public static synchronized void keep(String json) {
                  BACKLOG.add(json);
                  BACKLOG_T.add(System.currentTimeMillis());
                  while (BACKLOG.size() > 30) {
                      BACKLOG.poll();
                      BACKLOG_T.poll();
                  }
              }

              /** JSON array with the notifications that arrived while the page was not ready (max 3 minutes old). */
              public static synchronized String drain() {
                  StringBuilder sb = new StringBuilder("[");
                  long now = System.currentTimeMillis();
                  boolean first = true;
                  while (!BACKLOG.isEmpty()) {
                      String j = BACKLOG.poll();
                      Long t = BACKLOG_T.poll();
                      if (t != null && now - t > 180000L) continue;
                      if (!first) sb.append(',');
                      sb.append(j);
                      first = false;
                  }
                  return sb.append(']').toString();
              }

              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  try {
                      handle(sbn);
                  } catch (Throwable t) {
                      // never crash the listener
                  }
              }

              private void handle(StatusBarNotification sbn) throws Exception {
                  if (sbn == null) return;
                  Notification n = sbn.getNotification();
                  if (n == null) return;
                  String pkg = sbn.getPackageName();
                  if (pkg == null || pkg.equals(getPackageName()) || pkg.equals("android") || pkg.equals("com.android.systemui")) return;
                  if ((n.flags & Notification.FLAG_GROUP_SUMMARY) != 0) return;
                  String cat = n.category == null ? "" : n.category;
                  boolean call = cat.equals(Notification.CATEGORY_CALL);
                  if ((n.flags & Notification.FLAG_ONGOING_EVENT) != 0 && !call) return;
                  if (cat.equals(Notification.CATEGORY_TRANSPORT) || cat.equals(Notification.CATEGORY_PROGRESS)
                          || cat.equals(Notification.CATEGORY_SERVICE) || cat.equals(Notification.CATEGORY_SYSTEM)
                          || cat.equals(Notification.CATEGORY_STATUS) || cat.equals(Notification.CATEGORY_NAVIGATION)) return;

                  Bundle ex = n.extras;
                  if (ex == null) return;
                  CharSequence title = ex.getCharSequence(Notification.EXTRA_TITLE);
                  CharSequence text = ex.getCharSequence(Notification.EXTRA_BIG_TEXT);
                  if (text == null || text.length() == 0) text = ex.getCharSequence(Notification.EXTRA_TEXT);
                  String t = title == null ? "" : title.toString().trim();
                  String x = text == null ? "" : text.toString().trim();
                  if (t.isEmpty() && x.isEmpty()) return;

                  String label = pkg;
                  try {
                      PackageManager pm = getPackageManager();
                      label = pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString();
                  } catch (Throwable e) {
                      // keep package name
                  }

                  JSONObject o = new JSONObject();
                  o.put("pkg", pkg);
                  o.put("app", label);
                  o.put("title", t);
                  o.put("text", x);
                  o.put("cat", call ? "call" : cat);
                  String json = o.toString();
                  Sink s = sink;
                  if (s != null) s.onNotif(json);
                  else keep(json);
              }
          }
