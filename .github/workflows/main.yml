          cat > android/app/src/main/java/com/smarthud/glasses/MainActivity.java <<'WF_EOF'
          package com.smarthud.glasses;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.PowerManager;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.view.WindowManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import org.json.JSONObject;

          import java.io.ByteArrayInputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;

          public class MainActivity extends Activity {

              static final String HOST = "smarthud.local";
              private static final int REQ_PERMS = 1, REQ_FILE = 77, REQ_AUDIO = 42, REQ_GEO = 43;

              private WebView web;
              private BleBridge ble;
              private SpeechRecognizer speech;
              private String pendingLang = "nl-NL";
              private ValueCallback<Uri[]> fileCb;
              private GeolocationPermissions.Callback geoCb;
              private String geoOrigin;
              private volatile boolean pageReady = false;

              private void evalJs(final String script) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          if (web != null) web.evaluateJavascript(script, null);
                      }
                  });
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);

                  ble = new BleBridge(this, new BleBridge.Js() {
                      @Override
                      public void eval(String script) {
                          evalJs(script);
                      }
                  });
                  web.addJavascriptInterface(ble, "AndroidBLE");
                  web.addJavascriptInterface(new AppBridge(), "AndroidApp");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          WebResourceResponse r = serve(request.getUrl());
                          return r != null ? r : super.shouldInterceptRequest(view, request);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          if (HOST.equals(u.getHost())) return false;
                          openExternal(u);
                          return true;
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, android.graphics.Bitmap favicon) {
                          pageReady = false;
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                              callback.invoke(origin, true, false);
                          } else {
                              geoCb = callback;
                              geoOrigin = origin;
                              requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, REQ_GEO);
                          }
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = callback;
                          try {
                              startActivityForResult(params.createIntent(), REQ_FILE);
                          } catch (ActivityNotFoundException e) {
                              fileCb = null;
                              callback.onReceiveValue(null);
                              return false;
                          }
                          return true;
                      }
                  });

                  NotifService.sink = new NotifService.Sink() {
                      @Override
                      public void onNotif(String json) {
                          if (!pageReady) NotifService.keep(json);
                          else evalJs("window.onNativeNotif&&window.onNativeNotif(" + json + ")");
                      }
                  };

                  askPermissions();
                  web.loadUrl("https://" + HOST + "/index.html");
              }

              private void askPermissions() {
                  List<String> need = new ArrayList<>();
                  if (Build.VERSION.SDK_INT >= 31) {
                      need.add(Manifest.permission.BLUETOOTH_SCAN);
                      need.add(Manifest.permission.BLUETOOTH_CONNECT);
                  }
                  need.add(Manifest.permission.ACCESS_FINE_LOCATION);
                  if (Build.VERSION.SDK_INT >= 33) need.add(Manifest.permission.POST_NOTIFICATIONS);
                  List<String> todo = new ArrayList<>();
                  for (String p : need) {
                      if (checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) todo.add(p);
                  }
                  if (!todo.isEmpty()) requestPermissions(todo.toArray(new String[0]), REQ_PERMS);
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] results) {
                  boolean ok = results.length > 0 && results[0] == PackageManager.PERMISSION_GRANTED;
                  if (code == REQ_GEO && geoCb != null) {
                      geoCb.invoke(geoOrigin, ok, false);
                      geoCb = null;
                  } else if (code == REQ_AUDIO) {
                      if (ok) beginSpeech(pendingLang);
                      else evalJs("window.onNativeSpeech&&window.onNativeSpeech('','Microphone permission denied')");
                  }
                  super.onRequestPermissionsResult(code, perms, results);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == REQ_FILE) {
                      if (fileCb != null) {
                          Uri[] r = null;
                          try {
                              r = WebChromeClient.FileChooserParams.parseResult(res, data);
                          } catch (Throwable t) {
                              // ignore
                          }
                          fileCb.onReceiveValue(r);
                          fileCb = null;
                      }
                      return;
                  }
                  super.onActivityResult(req, res, data);
              }

              @Override
              public void onBackPressed() {
                  moveTaskToBack(true);      // keep running (Bluetooth link, notifications)
              }

              @Override
              protected void onDestroy() {
                  NotifService.sink = null;
                  pageReady = false;
                  if (speech != null) {
                      try {
                          speech.destroy();
                      } catch (Throwable t) {
                          // ignore
                      }
                      speech = null;
                  }
                  super.onDestroy();
              }

              // ------------------------------------------------------------------ local asset server (https://smarthud.local/...)

              private static String mime(String p) {
                  String l = p.toLowerCase();
                  if (l.endsWith(".html")) return "text/html";
                  if (l.endsWith(".js")) return "application/javascript";
                  if (l.endsWith(".css")) return "text/css";
                  if (l.endsWith(".json")) return "application/json";
                  if (l.endsWith(".webmanifest")) return "application/manifest+json";
                  if (l.endsWith(".png")) return "image/png";
                  if (l.endsWith(".svg")) return "image/svg+xml";
                  return "application/octet-stream";
              }

              private WebResourceResponse serve(Uri u) {
                  if (!HOST.equals(u.getHost())) return null;
                  String p = u.getPath();
                  if (p == null || p.isEmpty() || p.equals("/")) p = "/index.html";
                  p = p.substring(1);
                  if (p.contains("..")) return null;
                  try {
                      InputStream in = getAssets().open(p);
                      return new WebResourceResponse(mime(p), "utf-8", in);
                  } catch (IOException e) {
                      return new WebResourceResponse("text/plain", "utf-8", 404, "Not Found", new HashMap<String, String>(), new ByteArrayInputStream(new byte[0]));
                  }
              }

              private void openExternal(Uri u) {
                  String sc = u.getScheme();
                  if (!"http".equals(sc) && !"https".equals(sc) && !"mailto".equals(sc) && !"tel".equals(sc)) return;
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, u));
                  } catch (Throwable t) {
                      // ignore
                  }
              }

              // ------------------------------------------------------------------ native speech recognition

              private void beginSpeech(String lang) {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      evalJs("window.onNativeSpeech&&window.onNativeSpeech('','Speech recognition is not available on this phone')");
                      return;
                  }
                  if (speech == null) {
                      speech = SpeechRecognizer.createSpeechRecognizer(this);
                      speech.setRecognitionListener(new RecognitionListener() {
                          @Override public void onReadyForSpeech(Bundle params) { }
                          @Override public void onBeginningOfSpeech() { }
                          @Override public void onRmsChanged(float rmsdB) { }
                          @Override public void onBufferReceived(byte[] buffer) { }
                          @Override public void onEndOfSpeech() { }
                          @Override public void onPartialResults(Bundle partialResults) { }
                          @Override public void onEvent(int eventType, Bundle params) { }

                          @Override
                          public void onError(int error) {
                              evalJs("window.onNativeSpeech&&window.onNativeSpeech('','')");
                          }

                          @Override
                          public void onResults(Bundle results) {
                              ArrayList<String> l = results == null ? null : results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                              String t = (l == null || l.isEmpty()) ? "" : l.get(0);
                              evalJs("window.onNativeSpeech&&window.onNativeSpeech(" + JSONObject.quote(t) + ",'')");
                          }
                      });
                  }
                  Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang);
                  i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, false);
                  i.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1);
                  speech.startListening(i);
              }

              // ------------------------------------------------------------------ window.AndroidApp

              private class AppBridge {

                  @JavascriptInterface
                  public boolean notifEnabled() {
                      try {
                          String s = Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners");
                          return s != null && s.contains(getPackageName());
                      } catch (Throwable t) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void openNotifSettings() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
                              } catch (Throwable t) {
                                  try {
                                      startActivity(new Intent(Settings.ACTION_SETTINGS));
                                  } catch (Throwable t2) {
                                      // ignore
                                  }
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void batterySettings() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                                  if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                                      startActivity(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + getPackageName())));
                                  } else {
                                      startActivity(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS));
                                  }
                              } catch (Throwable t) {
                                  // ignore
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void keepAlive(final boolean on) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  Intent i = new Intent(MainActivity.this, KeepAliveService.class);
                                  if (on) startForegroundService(i);
                                  else stopService(i);
                              } catch (Throwable t) {
                                  // background start not allowed or permission missing: ignore
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void keepScreen(final boolean on) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              if (on) getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                              else getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          }
                      });
                  }

                  @JavascriptInterface
                  public String drainNotifs() {
                      String r = NotifService.drain();
                      pageReady = true;
                      return r;
                  }

                  @JavascriptInterface
                  public void startListening(final String lang) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              pendingLang = lang == null ? "nl-NL" : lang;
                              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                                  requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, REQ_AUDIO);
                              } else {
                                  beginSpeech(pendingLang);
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public String saveFile(String name, String mime, String text) {
                      try {
                          String safe = name.replaceAll("[^A-Za-z0-9._-]", "_");
                          byte[] bytes = text.getBytes(StandardCharsets.UTF_8);
                          if (Build.VERSION.SDK_INT >= 29) {
                              ContentResolver cr = getContentResolver();
                              ContentValues v = new ContentValues();
                              v.put(MediaStore.MediaColumns.DISPLAY_NAME, safe);
                              v.put(MediaStore.MediaColumns.MIME_TYPE, mime == null || mime.isEmpty() ? "application/octet-stream" : mime);
                              v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri u = cr.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                              if (u == null) return "Save failed";
                              OutputStream os = cr.openOutputStream(u);
                              if (os == null) return "Save failed";
                              os.write(bytes);
                              os.close();
                              return "Downloads/" + safe;
                          }
                          File dir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                          if (dir == null) return "Save failed";
                          File f = new File(dir, safe);
                          FileOutputStream os = new FileOutputStream(f);
                          os.write(bytes);
                          os.close();
                          return f.getAbsolutePath();
                      } catch (Throwable t) {
                          return "Save failed: " + t.getMessage();
                      }
                  }
              }
          }
