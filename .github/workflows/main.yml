# Smart HUD - builds the Android APK for you (free, on GitHub). No Android Studio needed.
# How: Actions tab -> "set up a workflow yourself" -> paste this whole file -> Commit.
# Then: Actions -> "Build Android APK" -> wait ~5 min -> open "Releases" on the repo home page and download SmartHUD.apk
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          set -e
          mkdir -p android/app/src/main/assets android/app/src/main/res/mipmap-xxhdpi
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png android/app/src/main/assets/
          cp icon-192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          cat > android/settings.gradle <<'WF_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'SmartHUD'
          include ':app'
          WF_EOF

          cat > android/build.gradle <<'WF_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          WF_EOF

          cat > android/gradle.properties <<'WF_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          WF_EOF
          mkdir -p "android/app"
          cat > android/app/build.gradle <<'WF_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.smarthud.glasses'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.smarthud.glasses'
                  minSdk 26
                  targetSdk 34
                  versionCode 160
                  versionName '1.6.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
              }
          }
          WF_EOF
          mkdir -p "android/app/src/main"
          cat > android/app/src/main/AndroidManifest.xml <<'WF_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>

              <application
                  android:label="Smart HUD"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|screenLayout|smallestScreenSize|uiMode|density|layoutDirection|locale">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".NotifService"
                      android:exported="true"
                      android:label="Smart HUD"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

                  <service
                      android:name=".KeepAliveService"
                      android:exported="false"
                      android:foregroundServiceType="connectedDevice|location" />
              </application>
          </manifest>
          WF_EOF
          mkdir -p "android/app/src/main/res/values"
          cat > android/app/src/main/res/values/styles.xml <<'WF_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/bg</item>
              </style>
          </resources>
          WF_EOF
          mkdir -p "android/app/src/main/res/values"
          cat > android/app/src/main/res/values/colors.xml <<'WF_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#0a0f1a</color>
          </resources>
          WF_EOF
          mkdir -p "android/app/src/main/java/com/smarthud/glasses"
          cat > android/app/src/main/java/com/smarthud/glasses/BleBridge.java <<'WF_EOF'
          package com.smarthud.glasses;

          import android.annotation.SuppressLint;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattDescriptor;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.BluetoothStatusCodes;
          import android.bluetooth.le.BluetoothLeScanner;
          import android.bluetooth.le.ScanCallback;
          import android.bluetooth.le.ScanRecord;
          import android.bluetooth.le.ScanResult;
          import android.bluetooth.le.ScanSettings;
          import android.content.Context;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.ParcelUuid;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;

          import org.json.JSONObject;

          import java.util.ArrayDeque;
          import java.util.UUID;

          /**
           * Minimal native BLE client exposed to the page as window.AndroidBLE.
           * The page ships a small "navigator.bluetooth" shim on top of it, so the web app code is unchanged.
           */
          @SuppressLint("MissingPermission")
          @SuppressWarnings("deprecation")
          public class BleBridge {

              public interface Js {
                  void eval(String script);
              }

              private static final UUID CCCD = UUID.fromString("00002902-0000-1000-8000-00805f9b34fb");

              private static class Op {
                  int id;
                  int type;               // 0 read, 1 write, 2 notify
                  BluetoothGattCharacteristic ch;
                  byte[] data;
                  boolean resp;
                  int tries;
                  Runnable timeout;
              }

              private final Context ctx;
              private final Js js;
              private final Handler main = new Handler(Looper.getMainLooper());
              private final Object lock = new Object();
              private final ArrayDeque<Op> queue = new ArrayDeque<>();
              private Op cur;
              private BluetoothGatt gatt;
              private boolean linked;
              private boolean discovering;
              private int connectId = -1;
              private Runnable connectTimeout;
              private int scanId = -1;
              private ScanCallback scanCb;
              private Runnable scanTimeout;

              private final Runnable pumpTask = new Runnable() {
                  @Override
                  public void run() {
                      synchronized (lock) {
                          pump();
                      }
                  }
              };

              public BleBridge(Context ctx, Js js) {
                  this.ctx = ctx;
                  this.js = js;
              }

              // ------------------------------------------------------------------ JS entry point

              @JavascriptInterface
              public void call(int id, String method, String args) {
                  try {
                      JSONObject o = new JSONObject(args == null || args.isEmpty() ? "{}" : args);
                      switch (method) {
                          case "on":
                              resolve(id, isOn() ? "1" : "0");
                              break;
                          case "scan":
                              scan(id, o);
                              break;
                          case "connect":
                              connect(id, o.getString("a"));
                              break;
                          case "disconnect":
                              disconnect(id);
                              break;
                          case "has":
                              has(id, o);
                              break;
                          case "read":
                          case "write":
                          case "notify":
                              gattOp(id, method, o);
                              break;
                          default:
                              reject(id, "unknown method " + method);
                      }
                  } catch (Throwable t) {
                      String m = t.getMessage();
                      reject(id, m == null ? t.toString() : m);
                  }
              }

              // ------------------------------------------------------------------ helpers

              private void resolve(int id, String data) {
                  js.eval("window.__bleCb&&window.__bleCb(" + id + ",true," + JSONObject.quote(data == null ? "" : data) + ")");
              }

              private void reject(int id, String msg) {
                  js.eval("window.__bleCb&&window.__bleCb(" + id + ",false," + JSONObject.quote(msg == null ? "error" : msg) + ")");
              }

              private void event(String type, String a, String b) {
                  js.eval("window.__bleEvt&&window.__bleEvt(" + JSONObject.quote(type) + "," + JSONObject.quote(a) + "," + JSONObject.quote(b) + ")");
              }

              private BluetoothAdapter adapter() {
                  BluetoothManager m = (BluetoothManager) ctx.getSystemService(Context.BLUETOOTH_SERVICE);
                  return m == null ? null : m.getAdapter();
              }

              private boolean isOn() {
                  BluetoothAdapter ad = adapter();
                  return ad != null && ad.isEnabled();
              }

              // ------------------------------------------------------------------ scan

              private void stopScan() {   // lock held
                  if (scanCb != null) {
                      try {
                          BluetoothAdapter ad = adapter();
                          BluetoothLeScanner sc = ad == null ? null : ad.getBluetoothLeScanner();
                          if (sc != null) sc.stopScan(scanCb);
                      } catch (Throwable t) {
                          // ignore
                      }
                      scanCb = null;
                  }
                  if (scanTimeout != null) {
                      main.removeCallbacks(scanTimeout);
                      scanTimeout = null;
                  }
                  scanId = -1;
              }

              private void scan(final int id, JSONObject o) throws Exception {
                  BluetoothAdapter ad = adapter();
                  if (ad == null || !ad.isEnabled()) {
                      reject(id, "Bluetooth is off");
                      return;
                  }
                  BluetoothLeScanner sc = ad.getBluetoothLeScanner();
                  if (sc == null) {
                      reject(id, "Bluetooth scanner unavailable");
                      return;
                  }
                  String s = o.optString("s", "");
                  final UUID svc = s.isEmpty() ? null : UUID.fromString(s);
                  final String prefix = o.optString("n", "");
                  synchronized (lock) {
                      stopScan();
                      scanId = id;
                      scanCb = new ScanCallback() {
                          @Override
                          public void onScanResult(int callbackType, ScanResult r) {
                              synchronized (lock) {
                                  if (scanId != id) return;
                                  BluetoothDevice d = r.getDevice();
                                  ScanRecord rec = r.getScanRecord();
                                  String n = null;
                                  try {
                                      n = d.getName();
                                  } catch (Throwable t) {
                                      // ignore
                                  }
                                  if (n == null && rec != null) n = rec.getDeviceName();
                                  boolean m = n != null && prefix.length() > 0 && n.startsWith(prefix);
                                  if (!m && svc != null && rec != null && rec.getServiceUuids() != null) {
                                      for (ParcelUuid p : rec.getServiceUuids()) {
                                          if (svc.equals(p.getUuid())) m = true;
                                      }
                                  }
                                  if (!m) return;
                                  stopScan();
                                  try {
                                      JSONObject out = new JSONObject();
                                      out.put("id", d.getAddress());
                                      out.put("name", n == null ? prefix : n);
                                      resolve(id, out.toString());
                                  } catch (Throwable t) {
                                      reject(id, "scan error");
                                  }
                              }
                          }

                          @Override
                          public void onScanFailed(int errorCode) {
                              synchronized (lock) {
                                  if (scanId == id) {
                                      stopScan();
                                      reject(id, "scan failed " + errorCode);
                                  }
                              }
                          }
                      };
                      sc.startScan(null, new ScanSettings.Builder().setScanMode(ScanSettings.SCAN_MODE_LOW_LATENCY).build(), scanCb);
                      scanTimeout = new Runnable() {
                          @Override
                          public void run() {
                              synchronized (lock) {
                                  if (scanId == id) {
                                      stopScan();
                                      reject(id, "NotFound: no glasses found nearby");
                                  }
                              }
                          }
                      };
                      main.postDelayed(scanTimeout, 12000);
                  }
              }

              // ------------------------------------------------------------------ connect / disconnect

              private void failAll(String msg) {   // lock held
                  for (Op op : queue) reject(op.id, msg);
                  queue.clear();
                  if (cur != null) {
                      if (cur.timeout != null) main.removeCallbacks(cur.timeout);
                      reject(cur.id, msg);
                      cur = null;
                  }
              }

              private void closeGatt() {   // lock held
                  failAll("disconnected");
                  if (gatt != null) {
                      try {
                          gatt.disconnect();
                      } catch (Throwable t) {
                          // ignore
                      }
                      try {
                          gatt.close();
                      } catch (Throwable t) {
                          // ignore
                      }
                      gatt = null;
                  }
                  linked = false;
                  discovering = false;
              }

              private void connect(final int id, String addr) {
                  BluetoothAdapter ad = adapter();
                  if (ad == null || !ad.isEnabled()) {
                      reject(id, "Bluetooth is off");
                      return;
                  }
                  synchronized (lock) {
                      stopScan();
                      if (connectTimeout != null) main.removeCallbacks(connectTimeout);
                      closeGatt();
                      BluetoothDevice d = ad.getRemoteDevice(addr);
                      connectId = id;
                      gatt = d.connectGatt(ctx, false, cb, BluetoothDevice.TRANSPORT_LE);
                      if (gatt == null) {
                          connectId = -1;
                          reject(id, "connectGatt failed");
                          return;
                      }
                      connectTimeout = new Runnable() {
                          @Override
                          public void run() {
                              synchronized (lock) {
                                  if (connectId == id) {
                                      connectId = -1;
                                      closeGatt();
                                      reject(id, "connection timeout");
                                  }
                              }
                          }
                      };
                      main.postDelayed(connectTimeout, 20000);
                  }
              }

              private void disconnect(int id) {
                  synchronized (lock) {
                      if (gatt != null) {
                          try {
                              gatt.disconnect();
                          } catch (Throwable t) {
                              // ignore
                          }
                      }
                  }
                  resolve(id, "");
              }

              private void discover(BluetoothGatt g) {   // lock held
                  if (discovering) return;
                  discovering = true;
                  boolean ok = false;
                  try {
                      ok = g.discoverServices();
                  } catch (Throwable t) {
                      // ignore
                  }
                  if (!ok && connectId >= 0) {
                      int cid = connectId;
                      connectId = -1;
                      closeGatt();
                      reject(cid, "service discovery failed");
                  }
              }

              private void has(int id, JSONObject o) throws Exception {
                  synchronized (lock) {
                      if (gatt == null || !linked) {
                          reject(id, "Not connected");
                          return;
                      }
                      BluetoothGattService s = gatt.getService(UUID.fromString(o.getString("s")));
                      if (s == null) {
                          reject(id, "NotFound: service");
                          return;
                      }
                      String c = o.optString("c", "");
                      if (!c.isEmpty() && s.getCharacteristic(UUID.fromString(c)) == null) {
                          reject(id, "NotFound: characteristic");
                          return;
                      }
                      resolve(id, "");
                  }
              }

              // ------------------------------------------------------------------ GATT operation queue

              private void gattOp(int id, String method, JSONObject o) throws Exception {
                  synchronized (lock) {
                      if (gatt == null || !linked) {
                          reject(id, "Not connected");
                          return;
                      }
                      BluetoothGattService s = gatt.getService(UUID.fromString(o.getString("s")));
                      BluetoothGattCharacteristic c = s == null ? null : s.getCharacteristic(UUID.fromString(o.getString("c")));
                      if (c == null) {
                          reject(id, "NotFound: characteristic");
                          return;
                      }
                      Op op = new Op();
                      op.id = id;
                      op.ch = c;
                      if (method.equals("read")) {
                          op.type = 0;
                      } else if (method.equals("write")) {
                          op.type = 1;
                          op.data = Base64.decode(o.getString("v"), Base64.NO_WRAP);
                          op.resp = o.optInt("r", 1) == 1;
                      } else {
                          op.type = 2;
                      }
                      queue.add(op);
                      pump();
                  }
              }

              /** 0 = failed, 1 = started (wait for callback), 2 = already done */
              private int startOp(Op op) {
                  try {
                      BluetoothGattCharacteristic c = op.ch;
                      if (op.type == 0) return gatt.readCharacteristic(c) ? 1 : 0;
                      if (op.type == 1) {
                          int wt = op.resp ? BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT : BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE;
                          if (Build.VERSION.SDK_INT >= 33) {
                              return gatt.writeCharacteristic(c, op.data, wt) == BluetoothStatusCodes.SUCCESS ? 1 : 0;
                          }
                          c.setWriteType(wt);
                          c.setValue(op.data);
                          return gatt.writeCharacteristic(c) ? 1 : 0;
                      }
                      gatt.setCharacteristicNotification(c, true);
                      BluetoothGattDescriptor d = c.getDescriptor(CCCD);
                      if (d == null) return 2;
                      byte[] v = (c.getProperties() & BluetoothGattCharacteristic.PROPERTY_NOTIFY) != 0
                              ? BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE
                              : BluetoothGattDescriptor.ENABLE_INDICATION_VALUE;
                      if (Build.VERSION.SDK_INT >= 33) {
                          return gatt.writeDescriptor(d, v) == BluetoothStatusCodes.SUCCESS ? 1 : 0;
                      }
                      d.setValue(v);
                      return gatt.writeDescriptor(d) ? 1 : 0;
                  } catch (Throwable t) {
                      return 0;
                  }
              }

              private void pump() {   // lock held
                  while (cur == null && !queue.isEmpty() && gatt != null) {
                      final Op op = queue.poll();
                      int r = startOp(op);
                      if (r == 0) {
                          if (op.type == 1 && ++op.tries < 10) {      // stack busy: try again shortly
                              queue.addFirst(op);
                              main.postDelayed(pumpTask, 20);
                              return;
                          }
                          reject(op.id, "GATT operation failed");
                          continue;
                      }
                      if (r == 2) {
                          resolve(op.id, "");
                          continue;
                      }
                      cur = op;
                      final boolean soft = op.type == 1 && !op.resp;   // write without response: do not wait long for the callback
                      op.timeout = new Runnable() {
                          @Override
                          public void run() {
                              synchronized (lock) {
                                  if (cur == op) {
                                      cur = null;
                                      if (soft) resolve(op.id, "");
                                      else reject(op.id, "timeout");
                                      pump();
                                  }
                              }
                          }
                      };
                      main.postDelayed(op.timeout, soft ? 120 : 6000);
                      return;
                  }
              }

              private void finishOp(int type, BluetoothGattCharacteristic c, boolean ok, String data) {
                  synchronized (lock) {
                      Op o = cur;
                      if (o == null || o.type != type) return;
                      if (c != null && o.ch != c && o.ch.getUuid() != null && !o.ch.getUuid().equals(c.getUuid())) return;
                      if (o.timeout != null) main.removeCallbacks(o.timeout);
                      cur = null;
                      if (ok) resolve(o.id, data);
                      else reject(o.id, "GATT status error");
                      pump();
                  }
              }

              private static String b64(byte[] v) {
                  return v == null ? "" : Base64.encodeToString(v, Base64.NO_WRAP);
              }

              // ------------------------------------------------------------------ GATT callbacks

              private final BluetoothGattCallback cb = new BluetoothGattCallback() {

                  @Override
                  public void onConnectionStateChange(final BluetoothGatt g, int status, int newState) {
                      synchronized (lock) {
                          if (g != gatt) {
                              try {
                                  g.close();
                              } catch (Throwable t) {
                                  // ignore
                              }
                              return;
                          }
                          if (newState == BluetoothGatt.STATE_CONNECTED && status == BluetoothGatt.GATT_SUCCESS) {
                              main.postDelayed(new Runnable() {
                                  @Override
                                  public void run() {
                                      synchronized (lock) {
                                          if (g != gatt || connectId < 0) return;
                                          boolean ok = false;
                                          try {
                                              ok = g.requestMtu(247);
                                          } catch (Throwable t) {
                                              // ignore
                                          }
                                          if (!ok) discover(g);
                                      }
                                  }
                              }, 250);
                              main.postDelayed(new Runnable() {      // fallback if onMtuChanged never arrives
                                  @Override
                                  public void run() {
                                      synchronized (lock) {
                                          if (g == gatt && connectId >= 0) discover(g);
                                      }
                                  }
                              }, 3000);
                              return;
                          }
                          boolean wasLinked = linked;
                          int cid = connectId;
                          connectId = -1;
                          if (connectTimeout != null) main.removeCallbacks(connectTimeout);
                          failAll("disconnected");
                          try {
                              g.close();
                          } catch (Throwable t) {
                              // ignore
                          }
                          gatt = null;
                          linked = false;
                          discovering = false;
                          if (cid >= 0) reject(cid, "GATT error " + status);
                          if (wasLinked) event("d", "", "");
                      }
                  }

                  @Override
                  public void onMtuChanged(BluetoothGatt g, int mtu, int status) {
                      synchronized (lock) {
                          if (g == gatt && connectId >= 0) discover(g);
                      }
                  }

                  @Override
                  public void onServicesDiscovered(BluetoothGatt g, int status) {
                      synchronized (lock) {
                          if (g != gatt || connectId < 0) return;
                          int cid = connectId;
                          connectId = -1;
                          if (connectTimeout != null) main.removeCallbacks(connectTimeout);
                          if (status == BluetoothGatt.GATT_SUCCESS) {
                              linked = true;
                              resolve(cid, "");
                          } else {
                              closeGatt();
                              reject(cid, "service discovery error " + status);
                          }
                      }
                  }

                  // Android 13+
                  @Override
                  public void onCharacteristicRead(BluetoothGatt g, BluetoothGattCharacteristic c, byte[] value, int status) {
                      finishOp(0, c, status == BluetoothGatt.GATT_SUCCESS, b64(value));
                  }

                  // Android 12 and older
                  @Override
                  public void onCharacteristicRead(BluetoothGatt g, BluetoothGattCharacteristic c, int status) {
                      finishOp(0, c, status == BluetoothGatt.GATT_SUCCESS, b64(c.getValue()));
                  }

                  @Override
                  public void onCharacteristicWrite(BluetoothGatt g, BluetoothGattCharacteristic c, int status) {
                      finishOp(1, c, status == BluetoothGatt.GATT_SUCCESS, "");
                  }

                  @Override
                  public void onDescriptorWrite(BluetoothGatt g, BluetoothGattDescriptor d, int status) {
                      finishOp(2, null, status == BluetoothGatt.GATT_SUCCESS, "");
                  }

                  // Android 13+
                  @Override
                  public void onCharacteristicChanged(BluetoothGatt g, BluetoothGattCharacteristic c, byte[] value) {
                      event("n", c.getUuid().toString(), b64(value));
                  }

                  // Android 12 and older
                  @Override
                  public void onCharacteristicChanged(BluetoothGatt g, BluetoothGattCharacteristic c) {
                      event("n", c.getUuid().toString(), b64(c.getValue()));
                  }
              };
          }
          WF_EOF
